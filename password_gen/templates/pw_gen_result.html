<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Result</title>
    <style>
        body {
            background: linear-gradient(to left, teal, #1E90FF);
        }
        .password-display, .password-strength-result {
            text-align: left;
            font-size: 24px;
            margin-top: 20px;
        }
        h1 {
            text-align: left;
        }
        .left-button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Password Result</h1>
    <div class="password-display">
        <p>Generated Password: {{ generated_password }}</p>
    </div>
    
    <br>

    <!-- Password Strength Checker Form -->
    <form id="password-checker-form" onsubmit="checkPasswordStrength(event)">
        <label for="password">Enter the Password:</label>
        <input type="text" id="password" name="password" required>
        <button type="submit">Check Password Strength</button>
    </form>

    <!-- Result Display -->
    <div class="password-strength-result" id="password-strength-result"></div>

    <br>
    <form action="/pw_gen">
        <button class="left-button" type="submit">Generate a new password</button>
    </form>
    <br>
    <form action="/add_entry">
        <button class="left-button" type="submit">Add entry</button>
    </form>
    <br>
    <form action="/modify_entry">
        <button class="left-button" type="submit">Modify entry</button>
    </form>
    <br>
    <button class="left-button" onclick="window.location.href = '/homepage';">Home</button>

     <script>
        // Function to check password strength via AJAX request
        function checkPasswordStrength(event) {
            event.preventDefault();  // Prevent form submission

            const password = document.getElementById('password').value;

            // Send GET request to Flask backend
            fetch(`/check-password?password=${encodeURIComponent(password)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('password-strength-result').textContent = `Result: ${data.result}`;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('password-strength-result').textContent = 'Error checking password strength.';
                });
        }
    </script>

</body>
</html>
