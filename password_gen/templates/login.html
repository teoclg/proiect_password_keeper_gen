<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
</head>
<body>
    <h1>Log In to Master Account</h1>
    <form action="{{ url_for('login') }}" method="post">
        <label for="master_account_name">Username:</label>
        <input type="text" id="master_account_name" name="master_account_name" required><br><br>
        
        <label for="master_account_password">Password:</label>
        <input type="password" id="master_account_password" name="master_account_password" required><br><br>
        
        <button type="submit">Log In</button>
    </form>
</body>
</html>
