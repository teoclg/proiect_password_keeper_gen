<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Master Account with 2FA</title>
</head>
<body>
    <h1>Set Up Your Master Account</h1>

    <!-- Account Creation Form -->
    <form action="/sign_up_master_account" method="POST">
        <label for="master_account_name">Master Account Name:</label>
        <input type="text" id="master_account_name" name="master_account_name" required><br><br>
        
        <label for="master_account_password">Password:</label>
        <input type="password" id="master_account_password" name="master_account_password" required><br><br>

        <label for="master_account_email">Email Address:</label>
        <input type="email" id="master_account_email" name="master_account_email" required><br><br>

        <button type="submit">Create Account</button>
    </form>

    <!-- 2FA Setup Section (QR Code) -->
    <h2>Set Up Two-Factor Authentication (2FA)</h2>
    <p>Before creating your account, scan the QR code below with your authenticator app to enable 2FA.</p>
    
    <!-- QR code image, dynamically generated by the backend and displayed here -->
    <img src="{{ url_for('setup_2fa') }}" alt="2FA QR Code"><br><br>

    <p>Once scanned, you’ll need to enter a 6-digit code from your authenticator app each time you log in.</p>

    <p>
        <a href="/">Back to Dashboard</a>
    </p>

</body>
</html>
