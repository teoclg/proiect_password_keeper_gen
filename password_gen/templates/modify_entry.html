<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify Entry</title>
    <style>
        body {
            background: linear-gradient(to left, teal, #1E90FF);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center; /* Center-align all text */
        }
        
        .container {
            max-width: 800px;
            margin: 20px auto; /* Center the container horizontally */
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center; /* Center-align all text */
        }
        
        form {
            text-align: left; /* Left-align form elements */
            margin-top: 20px; /* Add some space between the header and the form */
        }
        
        label, input, select {
            display: block; /* Display form elements as block elements */
            margin: 10px auto; /* Add some space around each form element and center them horizontally */
            text-align: center;
        }
        
        input[type="submit"] {
            display: block;
            margin: 20px auto; /* Add space around the submit button and center it */
            padding: 10px 20px;
            background-color: teal;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        input[type="submit"]:hover {
            background-color: #008080;
        }
        
        .center-button {
            display: block;
            margin: 20px auto; /* Add space around the home button and center it */
            padding: 10px 20px;
            background-color: teal;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .center-button:hover {
            background-color: #008080;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Modify Entry</h1>
        <form action="/modify_entry" method="POST">
            <label for="id_account">Select an account to modify:</label>
            <select name="id_account" id="id_account">
                <!-- Populate options dynamically from Flask route -->
                {% for row in table_data %}
                    <option value="{{ row[0] }}">ID: {{ row[0] }} Site: {{ row[1]}} Email: {{row[2]}} Account name: {{row[3]}} Password: {{row[4]}}</option>
                {% endfor %}
            </select>
            <label for="site_name">Site Name:</label>
            <input type="text" id="site_name" name="site_name">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <label for="account_name">Account Name:</label>
            <input type="text" id="account_name" name="account_name">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <input type="submit" value="Modify Entry">
        </form>
        <button class="center-button" onclick="window.location.href = '/homepage';">Home</button>
    </div>
</body>
</html>
