<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Manager Popup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 10px;
    }
    input, button {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
      font-size: 14px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .field-container {
      margin-bottom: 10px;
    }
    .credentials {
      margin-top: 15px;
    }
    .success-message, .error-message {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
    .success-message {
      color: green;
    }
    .error-message {
      color: red;
    }
  </style>
</head>
<body>
  <h3>Password Manager</h3>
  
  <!-- Existing Fetch Section -->
  <div class="field-container">
    <input type="text" id="site-url" placeholder="Enter website URL" />
    <button id="fetch-credentials">Fetch Credentials</button>
  </div>

  <div class="credentials">
    <div><strong>Account Name:</strong> <span id="account-name">N/A</span></div>
    <div><strong>Password:</strong> <span id="password">N/A</span></div>
  </div>

  <hr>

  <!-- New Save Section -->
  <h4>Add New Credentials</h4>
  <div class="field-container">
    <input type="text" id="new-site-name" placeholder="Site Name" />
  </div>
  <div class="field-container">
    <input type="email" id="new-email" placeholder="Email" />
  </div>
  <div class="field-container">
    <input type="text" id="new-account-name" placeholder="Account Name" />
  </div>
  <div class="field-container">
    <input type="password" id="new-password" placeholder="Password" />
  </div>
  <button id="save-credentials">Save Credentials</button>

  <div class="success-message" id="save-success" style="display: none;">Credentials saved successfully!</div>
  <div class="error-message" id="save-error" style="display: none;">Failed to save credentials.</div>

  <script src="popup.js"></script>
</body>
</html>
