<!DOCTYPE html>
<html>
<head>
    <title>Delete Entries</title>
    <style>
        body {
            background: linear-gradient(to left, teal, #1E90FF);
        }

        table {
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            border-collapse: collapse;
            border: 2px solid black;
            background-color: #E0E0E0;
        }

        th, td {
            border: 2px solid black;
            padding: 8px;
        }

        .center-button {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1><center>Delete Entries</center></h1>
    <form action="/delete_entry" method="post">
        <table>
            <tr>
                <th>Select</th>
                <th>Site Name</th>
                <th>Email</th>
                <th>Account Name</th>
                <th>Password</th>
                <th>Details</th>
            </tr>
            {% for row in table_data %}
            <tr>
                <td>
                    <input type="checkbox" name="delete_{{ loop.index0 }}" value="yes" id="delete_{{ loop.index0 }}" disabled>
                    <button type="button" onclick="unlockCheckbox('{{ loop.index0 }}', '{{ row[3] }}')">Unlock</button>
                </td>
                <td>
                    <input type="hidden" name="site_name_{{ loop.index0 }}" value="{{ row[0] }}">
                    {{ row[0] }}
                </td>
                <td>
                    <input type="hidden" name="email_{{ loop.index0 }}" value="{{ row[1] }}">
                    {{ row[1] }}
                </td>
                <td>
                    <input type="hidden" name="account_name_{{ loop.index0 }}" value="{{ row[2] }}">
                    {{ row[2] }}
                </td>
                <td id="password_{{ loop.index0 }}">
                    <input type="hidden" name="password_{{ loop.index0 }}" value="{{ row[3] }}">
                    *****
                </td>
                <td>
                    <input type="hidden" name="details_{{ loop.index0 }}" value="{{ row[4] }}">
                    {{ row[4] }}
                </td>
            </tr>
            {% endfor %}
        </table>
        <br>
        <input type="submit" class="center-button" value="Delete Selected">
        <br><br>
        <button type="button" class="center-button" onclick="goToHome()">Home</button>
    </form>

    <script>
		function unlockCheckbox(index, actualPassword) {
			// Create a dialog box with a password field
			const dialog = document.createElement('div');
			dialog.style.position = 'fixed';
			dialog.style.left = '50%';
			dialog.style.top = '50%';
			dialog.style.transform = 'translate(-50%, -50%)';
			dialog.style.background = '#fff';
			dialog.style.border = '1px solid #ccc';
			dialog.style.padding = '20px';
			dialog.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
			dialog.style.zIndex = '1000';

			const label = document.createElement('label');
			label.textContent = "Enter the master password for this entry:";
			label.style.display = 'block';
			label.style.marginBottom = '10px';

			const input = document.createElement('input');
			input.type = 'password';
			input.style.width = '100%';
			input.style.marginBottom = '10px';

			const submitBtn = document.createElement('button');
			submitBtn.textContent = "Submit";
			submitBtn.style.marginRight = '10px';

			const cancelBtn = document.createElement('button');
			cancelBtn.textContent = "Cancel";

			// Add event listeners
			submitBtn.addEventListener('click', () => {
				const masterPassword = "{{ master_account_password }}"; // Retrieved from backend
				if (input.value === masterPassword) {
					document.getElementById(`delete_${index}`).disabled = false;
					document.getElementById(`password_${index}`).innerText = actualPassword;
					alert("Checkbox unlocked! You can select this entry for deletion.");
					document.body.removeChild(dialog);
				} else {
					alert("Incorrect password! Unable to unlock this checkbox.");
					input.value = ''; // Clear the password field
				}
			});

			cancelBtn.addEventListener('click', () => {
				document.body.removeChild(dialog);
			});

			// Append elements to the dialog
			dialog.appendChild(label);
			dialog.appendChild(input);
			dialog.appendChild(submitBtn);
			dialog.appendChild(cancelBtn);

			// Append dialog to the body
			document.body.appendChild(dialog);
		}

		function goToHome() {
			window.location.href = '/homepage';
		}
</script>

</body>
</html>
