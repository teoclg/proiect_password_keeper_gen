<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Entry</title>
    <style>
        body {
            background: linear-gradient(to left, teal, #1E90FF);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            text-align: center;
            margin-top: 20px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .submit-button {
            text-align: center;
        }
        .center-button {
            display: block;
            margin: 0 auto;
            padding: 10px 20px;
            background-color: teal;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .center-button:hover {
            background-color: #008080;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>New Entry</h1>
        <form action="/add_entry" method="POST">
            <div class="input-group">
                <label for="site_name">Site Name:</label>
                <input type="text" id="site_name" name="site_name" required>
            </div>

            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="account_name">Account Name:</label>
                <input type="text" id="account_name" name="account_name" required>
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="submit-button">
                <input type="submit" value="Submit" class="center-button">
            </div>
        </form>
        <br>
        <button class="center-button" onclick="window.location.href = '/homepage';">Home</button>
    </div>
</body>
</html>
