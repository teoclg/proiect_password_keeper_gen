<!DOCTYPE html>
<html>
<head>
    <title>Passwords</title>
    <style>
        body {
            background: linear-gradient(to left, teal, #1E90FF);
        }

        table {
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            border-collapse: collapse;
            border: 2px solid black;
            background-color: #E0E0E0; 
        }

        th, td {
            border: 2px solid black;
            padding: 8px;
        }

        .center-button {
            display: block;
            margin: 0 auto;
        }
    </style>
    <script>
    const MASTER_PASSWORD = "{{ master_account_password }}"; // Passed from backend

    function toggleIndividualPassword(toggleSwitch, passwordCell) {
        const cell = document.getElementById(passwordCell);
        const password = cell.dataset.password;

        if (toggleSwitch.checked) {
            // Create a dialog box with a password field
            const dialog = document.createElement('div');
            dialog.style.position = 'fixed';
            dialog.style.left = '50%';
            dialog.style.top = '50%';
            dialog.style.transform = 'translate(-50%, -50%)';
            dialog.style.background = '#fff';
            dialog.style.border = '1px solid #ccc';
            dialog.style.padding = '20px';
            dialog.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
            dialog.style.zIndex = '1000';

            const label = document.createElement('label');
            label.textContent = "Enter the master password:";
            label.style.display = 'block';
            label.style.marginBottom = '10px';

            const input = document.createElement('input');
            input.type = 'password';
            input.style.width = '100%';
            input.style.marginBottom = '10px';

            const submitBtn = document.createElement('button');
            submitBtn.textContent = 'Submit';
            submitBtn.style.marginRight = '10px';

            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';

            // Append elements to the dialog
            dialog.appendChild(label);
            dialog.appendChild(input);
            dialog.appendChild(submitBtn);
            dialog.appendChild(cancelBtn);
            document.body.appendChild(dialog);

            // Focus on the password input field
            input.focus();

            submitBtn.onclick = function () {
                if (input.value === MASTER_PASSWORD) {
                    cell.textContent = password;
                } else {
                    alert("Incorrect master password!");
                    toggleSwitch.checked = false; // Reset the switch if the password is incorrect
                }
                document.body.removeChild(dialog);
            };

            cancelBtn.onclick = function () {
                toggleSwitch.checked = false;
                document.body.removeChild(dialog);
            };
        } else {
            cell.textContent = '*****'; // Hide the password
        }
    }
</script>

</head>

<body>
    <h1><center>Password Table</center></h1>

    <table>
        <tr>
            <th>Site Name</th>
            <th>Email</th>
            <th>Account Name</th>
            <th>Password</th>
            <th>Details</th>
            <th>Toggle</th>
        </tr>
        {% for row in table_data %}
        <tr>
            <td>{{ row[0] }}</td> <!-- Site Name -->
            <td>{{ row[1] }}</td> <!-- Email -->
            <td>{{ row[2] }}</td> <!-- Account Name -->
            <td id="password-{{ loop.index }}" class="password-cell" data-password="{{ row[3] }}">*****</td> <!-- Password -->
            <td>{{ row[4] }}</td> <!-- Details -->
            <td>
                <label>
                    <input type="checkbox" 
                           onchange="toggleIndividualPassword(this, 'password-{{ loop.index }}')">
                    Show
                </label>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <form action="/add_entry">
        <button class="center-button" type="submit">Add Entry</button>
    </form>
    <br>
    <form action="/modify_entry">
        <button class="center-button" type="submit">Modify Entry</button>
    </form>
    <br>
    <form action="/delete_entry">
        <button class="center-button" type="submit">Delete Entry</button>
    </form>
    <br>
    <button class="center-button" onclick="window.location.href = '/homepage';">Home</button>
</body>
</html>
