<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Master Account Password</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://img.freepik.com/premium-photo/blue-pink-mesh-gradient-banner-background-wallpaper-website-template-landing-page-web-frame-text_685444-38.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -40px;
            height: 100vh;
            color: #ffffff;
            padding: 20px;
	    overflow: hidden;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 600px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
            color: #333;
        }

        label {
            font-size: 1.2em;
            margin-bottom: 20px;
            display: block;
            color: #666;
        }

        input[type="email"] {
            font-size: 1em;
            padding: 10px;
            width: 90%;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 40px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 15px 30px;
            background: #366fef;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #2853b4;
        }

        #responseMessage {
            margin-top: 40px;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Master Account Password</h1>

        <form id="resetPasswordForm">
            <label for="master_account_email">Master Account Email:</label>
            <input type="email" id="master_account_email" name="master_account_email" required>
            <button type="submit">Reset Password</button>
        </form>

        <div id="responseMessage"></div>
    </div>

    <script>
        // Handle form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Get the email value from the form
            const email = document.getElementById('master_account_email').value;

            // Create a request payload
            const data = {
                master_account_email: email
            };

            // Make a POST request to reset the password
            fetch('/reset_password_master_account', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                const responseMessage = document.getElementById('responseMessage');
                if (data.message) {
                    responseMessage.style.color = 'green';
                    responseMessage.innerText = data.message;
                } else if (data.error) {
                    responseMessage.style.color = 'red';
                    responseMessage.innerText = data.error;
                }
            })
            .catch(error => {
                const responseMessage = document.getElementById('responseMessage');
                responseMessage.style.color = 'red';
                responseMessage.innerText = 'An error occurred: ' + error.message;
            });
        });
    </script>
</body>
</html>
