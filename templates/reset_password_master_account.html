<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Master Account Password</title>
</head>
<body>

    <h1>Reset Master Account Password</h1>

    <form id="resetPasswordForm">
        <label for="master_account_email">Master Account Email:</label>
        <input type="email" id="master_account_email" name="master_account_email" required>
        <br><br>
        <button type="submit">Reset Password</button>
    </form>

    <div id="responseMessage" style="margin-top: 20px;"></div>

    <script>
        // Handle form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Get the email value from the form
            const email = document.getElementById('master_account_email').value;

            // Create a request payload
            const data = {
                master_account_email: email
            };

            // Make a POST request to reset the password
            fetch('/reset_password_master_account', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                const responseMessage = document.getElementById('responseMessage');
                if (data.message) {
                    responseMessage.style.color = 'green';
                    responseMessage.innerText = data.message;
                } else if (data.error) {
                    responseMessage.style.color = 'red';
                    responseMessage.innerText = data.error;
                }
            })
            .catch(error => {
                const responseMessage = document.getElementById('responseMessage');
                responseMessage.style.color = 'red';
                responseMessage.innerText = 'An error occurred: ' + error.message;
            });
        });
    </script>

</body>
</html>
