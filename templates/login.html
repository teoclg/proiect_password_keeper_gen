<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Login Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://img.freepik.com/premium-photo/blue-pink-mesh-gradient-banner-background-wallpaper-website-template-landing-page-web-frame-text_685444-38.jpg?semt=ais_hybrid') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;

        }

        .container {
            display: flex;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 1200px;
        }

        .illustration {
            flex: 1;
            background: #f2f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .illustration img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .form-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;

        }

        .form-container h2 {
            margin: 0;
            font-size: 46px;
            color: #333;
            position: absolute;
            top: 70px;
        }

        .form-container p {
            color: #666;
            font-size: 25px;
            margin: 20px 0;
            text-align: center;
            position: absolute;
            top: 130px;
        }

        .form {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .form-container input[type="text"]{
            width: 100%;
            padding: 10px;
            margin-top: 90px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px
        }
        
        .form-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;

        }

        .form-container button {
            width: 104%;
            padding: 12px;
            background: #007edc;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            margin-top: 50px; 
            align-self: center;
        }

        .form-container button:hover {
            background: #0062aa;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="illustration">
            <img src="https://img.freepik.com/free-vector/forgot-password-concept-illustration_114360-1123.jpg?t=st=1736608141~exp=1736611741~hmac=723c404611eebbfc32c0fd68ed8d8cc1c8152672fdfff16d2e6e07a88d29f85d&w=740" alt="Illustration">
        </div>
        <div class="form-container">
            <h2>Welcome back!</h2>
            <div class="form">
                <p>Login to your Master Account</p>
                <form action="{{ url_for('login') }}" method="post">
                    <input type="text" id="master_account_name" name="master_account_name" placeholder="Your email or username" required>
                    <input type="password" id="master_account_password" name="master_account_password" placeholder="Your password" required>
                    <button type="submit">Log In</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
