<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Table</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://img.freepik.com/premium-photo/blue-pink-mesh-gradient-banner-background-wallpaper-website-template-landing-page-web-frame-text_685444-38.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
	    margin-top: -100px;
            flex-direction: column;
            height: 100vh;
            color: #ffffff;
            padding: 20px;
            position: relative;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 900px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
            color: #333;
        }

        table {
            margin: 20px auto;
            text-align: center;
            border-collapse: collapse;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid #ccc;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            font-size: 1.1em;
            color: #000;
        }

        th {
            background-color: #0078d7;
            color: #fff;
        }

        td {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .rounded-button {
            display: inline-block;
            font-size: 1.2em;
            padding: 10px 20px;
            margin: 10px;
            color: #ffffff;
            background-color: #0078d7;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .rounded-button:hover {
            background-color: #005bb5;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .rounded-button:active {
            transform: translateY(0);
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
        }

        .logout-button {
            background-color: #ff4d4d;
        }

        .logout-button:hover {
            background-color: #d43f3f;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .home-button {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .dialog {
            position: fixed;
            top: 50%;
            left: 50%;
	    margin-top: -100px;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            width: 300px;
            padding: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .dialog label {
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #333;
        }

        .dialog input {
            font-size: 1em;
            padding: 10px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dialog button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background-color: #0078d7;
            color: white;
        }

        .dialog button:hover {
            background-color: #005bb5;
        }

        .dialog button.cancel-button {
            background-color: #d9534f;
        }

        .dialog button.cancel-button:hover {
            background-color: #c9302c;
        }
    </style>
    <script>
        const MASTER_PASSWORD = "{{ master_account_password }}"; // Passed from backend

        function toggleIndividualPassword(toggleSwitch, passwordCell) {
            const cell = document.getElementById(passwordCell);
            const password = cell.dataset.password;

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.style.display = 'block';

            if (toggleSwitch.checked) {
                const dialog = document.createElement('div');
                dialog.className = 'dialog';

                const label = document.createElement('label');
                label.textContent = "Enter the master password to unlock:";

                const input = document.createElement('input');
                input.type = 'password';

                const buttonContainer = document.createElement('div');
                buttonContainer.className = 'button-container';

                const submitBtn = document.createElement('button');
                submitBtn.textContent = 'Submit';

                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = 'Cancel';
                cancelBtn.className = 'cancel-button';

                submitBtn.addEventListener('click', () => {
                    if (input.value === MASTER_PASSWORD) {
                        cell.textContent = password;
                    } else {
                        alert("Incorrect password");
                        toggleSwitch.checked = false;
                    }
                    document.body.removeChild(dialog);
                    document.body.removeChild(overlay);
                });

                cancelBtn.addEventListener('click', () => {
                    toggleSwitch.checked = false;
                    document.body.removeChild(dialog);
                    document.body.removeChild(overlay);
                });

                buttonContainer.appendChild(cancelBtn);
                buttonContainer.appendChild(submitBtn);

                dialog.appendChild(label);
                dialog.appendChild(input);
                dialog.appendChild(buttonContainer);
                document.body.appendChild(overlay);
                document.body.appendChild(dialog);
            } else {
                cell.textContent = '*';
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <button class="rounded-button home-button" onclick="window.location.href = '/homepage';">Home</button>
        <h1>Password Table</h1>
        <table>
            <tr>
                <th>Site Name</th>
                <th>Email</th>
                <th>Account Name</th>
                <th>Password</th>
                <th>Details</th>
                <th>Toggle</th>
            </tr>
            {% for row in table_data %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td id="password-{{ loop.index }}" data-password="{{ row[3] }}">*</td>
                <td>{{ row[4] }}</td>
                <td>
                    <label>
                        <input type="checkbox" onchange="toggleIndividualPassword(this, 'password-{{ loop.index }}')">
                        Show
                    </label>
                </td>
            </tr>
            {% endfor %}
        </table>
        <div class="button-group">
            <form action="/add_entry">
                <button class="rounded-button">Add Entry</button>
            </form>
            <form action="/modify_entry">
                <button class="rounded-button">Modify Entry</button>
            </form>
            <form action="/delete_entry">
                <button class="rounded-button logout-button">Delete Entry</button>
            </form>
        </div>
    </div>
</body>
</html>
