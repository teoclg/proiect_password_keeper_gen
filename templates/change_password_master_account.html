<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Master Account Password</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://img.freepik.com/premium-photo/blue-pink-mesh-gradient-banner-background-wallpaper-website-template-landing-page-web-frame-text_685444-38.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            padding: 20px;
	    margin-top: -40px;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 700px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
            color: #333;
        }

        label {
            font-size: 1.2em;
            margin-bottom: 15px;
            display: block;
            color: #666;
        }

        input[type="email"],
        input[type="password"] {
            font-size: 1em;
            padding: 10px;
            width: 90%;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 15px 30px;
            background: #41cb52; /* New color for Change Password button */
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #008000; /* Hover color for Change Password button */
        }

        .green-text {
            color: #008000;
        }

        .red-text {
            color: #a60109;
        }

        .dashboard-link {
            margin-top: 20px;
        }

        .dashboard-link button {
            background: #0078d7;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 1em;
        }

        .dashboard-link button:hover {
            background: #005bb5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="position: relative; align-self: flex-start; margin-bottom: 20px;">
            <button style="background: #0078d7; padding: 10px 20px; border-radius: 12px; font-size: 1em; transition: background 0.3s ease;" onclick="window.location.href='/'" onmouseover="this.style.background='#005bb5';" onmouseout="this.style.background='#0078d7';">Back to Dashboard</button>
        </div>
        <h1>Change Your Master Account Password</h1>

        <!-- Password Change Form -->
        <form action="/change_password_master_account" method="POST">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="current_password">Current Password:</label>
            <input type="password" id="current_password" name="current_password" required>

            <label for="new_password">New Password:</label>
            <input type="password" id="new_password" name="new_password" required>

            <button type="submit" style="margin-top: 50px;">Change Password</button>
        </form>

        {% if password_changed %}
            <p class="green-text">Your password has been changed successfully!</p>
            
        {% elif error_message %}
            <p class="red-text">{{ error_message }}</p>
        {% endif %}

        
    </div>
</body>
</html>
