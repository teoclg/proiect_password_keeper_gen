<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator & Strength Checker</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://img.freepik.com/premium-photo/blue-pink-mesh-gradient-banner-background-wallpaper-website-template-landing-page-web-frame-text_685444-38.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
	    margin-top: 70px;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container-wrapper {
            display: flex;
            justify-content: space-between;
            width: 1100px;
            gap: 40px;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1{
            font-size: 1.9em;
            margin-bottom: 15px;
            color: #333;
            margin-bottom: 50px;
            margin-top: 30px;
        } 
        
        h2 {
            font-size: 1.9em;
            color: #333;
            margin-bottom: 50px;
            margin-top: 90px;
        }

        p {
            color: #000;
            font-size: 1.1em;
            margin-bottom: 15px;
            margin-top: -5px;
        }

        .input-group {
            margin-bottom: 15px;
            width: 100%;
        }

        label {
            font-size: 1.2em;
            margin-bottom: 5px;
            color: #333;
        }
        
        .slider-label {
            display: flex;
            justify-content: center; /* Centrează textul și numărul pe aceeași linie */
            align-items: center; /* Asigură alinierea pe verticală */
            gap: 200px; /* Apropiere între text și număr */
            margin-bottom: 10px; /* Spațiu între slider și text */
        }

        input[type="text"] {
            font-size: 1.1em;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            text-align: center;
            width: 67%;
            color: #555;
            margin-bottom: 15px;
            margin-top: 15px;
        }
        
        input[type="checkbox"] {
            font-size: 0.9em;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center; /* Poziționează checkbox-ul înaintea textului */
            justify-content: flex-start; /* Asigură alinierea la stânga pentru checkbox-uri */
            text-align: center; /* Centrează textul în raport cu containerul */
            width: 100%; /* Extinde pe toată lățimea containerului */
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center; /* Centrează checkbox-urile și textele */
        }
        
        .input-group:nth-of-type(2) {
            margin-top: 15px; /* Adaugă spațiu între slider și checkbox-uri */
            margin-bottom: 30px;
        }
        
        input[type="range"] {
            width: 90%; 
            margin: 0 auto;
            margin-top: 10px; /* Asigură spațiu între slider și text */
        }

        .generated-password {
            font-size: 1.1em;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            text-align: center;
            width: 67%;
            color: #555;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .strength-checker {
            font-size: 1.2em;
            margin: 10px 0;
            padding: 10px;
            width: 350px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            text-align: center;
            width: 67%;
            color: #555;
            margin-top: 25px;
        }

        button {
            width: 90%;
            padding: 12px;
            background: #007edc;
            width: 350px;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0062aa;
        }
    </style>
    <script>
        function generatePassword() {
            const length = document.getElementById('length').value;
            const lowercase = document.getElementById('lowercase').checked;
            const uppercase = document.getElementById('uppercase').checked;
            const numbers = document.getElementById('numbers').checked;
            const special = document.getElementById('special').checked;

            fetch('/pw_gen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `length=${length}&lowercase=${lowercase}&uppercase=${uppercase}&numbers=${numbers}&special=${special}`
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('password-display').textContent = data.generated_password;
            });
        }

        function copyToClipboard() {
            const password = document.getElementById('password-display').textContent;
            navigator.clipboard.writeText(password).then(() => {
                alert('Password copied to clipboard!');
            });
        }

        function checkPasswordStrength(event) {
            event.preventDefault();
            const password = document.getElementById('check-password').value;

            fetch(`/check-password?password=${encodeURIComponent(password)}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('strength-result').textContent = `Strength: ${data.result}`;
                })
                .catch(error => {
                    document.getElementById('strength-result').textContent = 'Error checking password strength.';
                });
        }
    </script>
</head>
<body>
    <div class="container-wrapper">
        <!-- Password Generator Container -->
        <div class="container">
            <h1>Password Generator</h1>
            <div class="input-group">
                <label class="slider-label">
                    <span>Password Length:</span>
                    <span id="length-value">8</span>
                </label>
                <input type="range" id="length" min="4" max="32" value="8" oninput="document.getElementById('length-value').textContent = this.value;">
            </div>

            <div class="input-group">
                <label class="checkbox-label"><input type="checkbox" id="lowercase" checked> Include Lowercase</label>
                <label class="checkbox-label"><input type="checkbox" id="uppercase" checked> Include Uppercase</label>
                <label class="checkbox-label"><input type="checkbox" id="numbers" checked> Include Numbers</label>
                <label class="checkbox-label"><input type="checkbox" id="special"> Include Special Characters</label>
            </div>

            <button onclick="generatePassword()">Generate Password</button>
            <div class="generated-password" id="password-display">Your password will appear here</div>
            <button onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>

        <!-- Password Strength Checker Container -->
        <div class="container">
            <h2>Check Password Strength</h2>
            <p>Enter a password below to check its strength:</p>
            <form onsubmit="checkPasswordStrength(event)">
                <input type="text" id="check-password" placeholder="Enter your password">
                <button type="submit">Check Strength</button>
            </form>
            <div class="strength-checker" id="strength-result">Strength will appear here</div>
        </div>
    </div>
</body>
</html>
