<!DOCTYPE html>
<html>
<head>
    <title>Password Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to left, teal, #1E90FF);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input[type="range"] {
            width: 100%;
        }
        .generated-password {
            font-size: 1.5em;
            margin: 20px 0;
        }
        .copy-btn {
            background: #1E90FF;
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .copy-btn:hover {
            background: #3AAEFF;
        }
        .strength-result {
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
    <script>
        function generatePassword() {
            const length = document.getElementById('length').value;
            const lowercase = document.getElementById('lowercase').checked;
            const uppercase = document.getElementById('uppercase').checked;
            const numbers = document.getElementById('numbers').checked;
            const special = document.getElementById('special').checked;

            fetch('/pw_gen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `length=${length}&lowercase=${lowercase}&uppercase=${uppercase}&numbers=${numbers}&special=${special}`
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('password-display').textContent = data.generated_password;
            });
        }

        function copyToClipboard() {
            const password = document.getElementById('password-display').textContent;
            navigator.clipboard.writeText(password).then(() => {
                alert('Password copied to clipboard!');
            });
        }

        function checkPasswordStrength(event) {
            event.preventDefault();
            const password = document.getElementById('check-password').value;

            fetch(`/check-password?password=${encodeURIComponent(password)}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('strength-result').textContent = `Strength: ${data.result}`;
                })
                .catch(error => {
                    document.getElementById('strength-result').textContent = 'Error checking password strength.';
                });
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        
        <div class="input-group">
            <label class="slider-label">
                <span>Password Length:</span>
                <span id="length-value">8</span>
            </label>
            <input type="range" id="length" min="4" max="32" value="8" oninput="document.getElementById('length-value').textContent = this.value;">
        </div>
        
        <div class="input-group">
            <label><input type="checkbox" id="lowercase" checked> Include Lowercase</label><br>
            <label><input type="checkbox" id="uppercase" checked> Include Uppercase</label><br>
            <label><input type="checkbox" id="numbers" checked> Include Numbers</label><br>
            <label><input type="checkbox" id="special"> Include Special Characters</label>
        </div>
        
        <button class="copy-btn" onclick="generatePassword()">Generate Password</button>
        
        <div class="generated-password" id="password-display">Your password will appear here</div>
        
        <button class="copy-btn" onclick="copyToClipboard()">Copy to Clipboard</button>

        <hr>
        <h2>Check Password Strength</h2>
        <form onsubmit="checkPasswordStrength(event)">
            <input type="text" id="check-password" placeholder="Enter your password">
            <button type="submit">Check Strength</button>
        </form>
        <div class="strength-result" id="strength-result"></div>
		<br>
		<button class="center-button" onclick="window.location.href = '/homepage';">Home</button>
    </div>
</body>
</html>
